[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bms"
version = "0.1.0"
description = "Bangla Manim Studio: narrated Bangla math/science animation renderer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "manim",
    "edge-tts",
    "pydub",
    "PySide6",
    "psutil",
]

[project.scripts]
bms = "bms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "manim: needs Manim/ffmpeg/LaTeX",
]
